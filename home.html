<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KURANDERAMX</title>
    <!-- Google Fonts: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Hojas de estilos externas -->
    <link rel="stylesheet" href="CSS/home.css">
    <link rel="stylesheet" href="CSS/footer.css">
</head>
<body>

    <header>
        <div id="header"></div>
    </header>

    <section class="hero-section">
        <div class="diagonal-bg">
            <div class="diagonal-shadow"></div>
            <div class="bg-magenta"></div>
            <div class="bg-orange"></div>
            <div class="bg-turquoise-shape"></div>
        </div>

        <div class="hero-content">
            <h1 class="hero-title">
                JOYERÍA Y<br>
                ACCESORIOS<br>
                ÚNICOS
            </h1>
            <a href="#productosContainer" id="btnLoQuieroYa" class="cta-button">¡LO QUIERO YA!</a>
        </div>

        <div class="hero-image-container">
            <img src="https://i.imgur.com/CNaR1NB.png" alt="Collares" class="hero-image">
        </div>
    </section>

    <!-- Sección de Productos en Carrusel -->
    <section class="productos-section">
        <h2 class="section-heading">NUESTROS PRODUCTOS</h2>
        <div class="carousel-wrapper">
            <button class="carousel-btn prev" onclick="scrollCarousel(-1)">&#10094;</button>
            
            <div id="productosContainer" class="productos-container">
                <p style="text-align: center; width: 100%;">Cargando productos...</p>
            </div>

            <button class="carousel-btn next" onclick="scrollCarousel(1)">&#10095;</button>
        </div>
    </section>

    <footer>
        <div id="footer"></div>
    </footer>

    <!-- Scripts externos -->
    <script src="scripts/home.js"></script>
    <script src="scripts/components.js"></script>
    <script src="scripts/carrito.js"></script>
    <script src="scripts/search.js"></script>
    <script src="scripts/cart.js"></script>
</body>
</html>
