<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anillos - KURANDERAMX</title>
    <!-- Google Fonts: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Hojas de estilos externas -->
    <link rel="stylesheet" href="CSS/home.css">
    <link rel="stylesheet" href="CSS/anillos.css">
    <link rel="stylesheet" href="CSS/footer.css">
</head>
<body>

    <header>
        <div id="header"></div>
    </header>

    <!-- Sección de Productos de Anillos en Cuadrícula -->
    <section class="productos-section" style="padding: 40px 20px; margin-top: 20px;">
        <h2 class="section-heading" style="text-align: center; margin-bottom: 30px;">ANILLOS</h2>
        
        <div id="productosContainer" class="productos-grid-container">
            <p style="text-align: center; grid-column: 1/-1;">Cargando anillos...</p>
        </div>
    </section>

    <footer>
        <div id="footer"></div>
    </footer>

    <!-- Lógica del Catálogo adaptada para leer la tercera pestaña (GID específico) -->
    <script>
        const SPREADSHEET_ID = '1bliVSZrIA0-MXRBsVztA5woG7rAwuL4_Zoabst8NWSc';
        
        // GID de la tercera pestaña (si tu tercera pestaña tiene otro gid en la URL de tu navegador, cámbialo aquí)
        const GID_HOJA_CONJUNTOS = '1452395999'; 
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID_HOJA_CONJUNTOS}`;

        async function cargarProductos() {
            try {
                const urlSinCache = `${CSV_URL}&t=${new Date().getTime()}`;
                const response = await fetch(urlSinCache);
                if (!response.ok) throw new Error('Error al conectar con Google Sheets');
                
                const csvText = await response.text();
                const conjuntos = parseCSV(csvText);
                
                renderizarProductos(conjuntos);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('productosContainer').innerHTML = `
                    <p style="text-align: center; color: red; grid-column: 1/-1;">
                        No se pudieron cargar los conjuntos. Verifica que la hoja sea pública.
                    </p>`;
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) return [];
            
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                const currentLine = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const obj = {};
                for (let j = 0; j < headers.length; j++) {
                    let value = currentLine[j] ? currentLine[j].trim() : '';
                    value = value.replace(/^"(.*)"$/, '$1');
                    obj[headers[j]] = value;
                }
                result.push(obj);
            }
            return result;
        }

        function renderizarProductos(productos) {
            const container = document.getElementById('productosContainer');
            if (!container) return;
            
            container.innerHTML = '';

            if (productos.length === 0) {
                container.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No hay conjuntos disponibles en esta pestaña.</p>';
                return;
            }

            productos.forEach(prod => {
                if (!prod.producto) return;

                let imagenSrc = prod.imagen ? prod.imagen.trim().replace(/['"]+/g, '') : '';
                if (!imagenSrc || (!imagenSrc.startsWith('http://') && !imagenSrc.startsWith('https://'))) {
                    imagenSrc = 'https://via.placeholder.com/300?text=Kurandera';
                }

                const card = document.createElement('div');
                card.className = 'product-card';

                card.innerHTML = `
                    <div class="product-img-container">
                        <img src="${imagenSrc}" alt="${prod.producto}" onerror="this.src='https://via.placeholder.com/300?text=Error+de+Imagen'">
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${prod.producto}</h3>
                        <p class="product-price">$${prod.precio || '0'} MXN</p>
                        <button class="btn-buy" style="margin-top: 8px; cursor: pointer;">Agregar al carrito</button>

                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarProductos();
        });
    </script>

    <!-- Scripts externos -->
    <script src="scripts/components.js"></script>
    <script src="scripts/search.js"></script>
    <script src="scripts/cart.js"></script>
</body>
</html>
